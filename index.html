<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <meta name="theme-color" content="#F3EEE5" />
    <meta
      name="description"
      content="番茄计划（Pomodoro Planner）—— 暖纸极简风格的在线番茄钟计划安排表，支持目标拆解、日程排程、复盘统计与本地数据备份。"
    />
    <title>番茄计划 · Pomodoro Planner</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('pomodoro_planner_state_v1');
          var theme = 'light';
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.settings && parsed.settings.theme) {
              theme = parsed.settings.theme;
            }
          }
          if (theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = theme;
        } catch (_) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
